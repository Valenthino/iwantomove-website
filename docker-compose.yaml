services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      LEADS_FILE: /data/leads.jsonl
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      LEAD_FROM_EMAIL: ${LEAD_FROM_EMAIL:-}
      LEAD_TO_EMAIL: ${LEAD_TO_EMAIL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - leads:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health.json').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  leads:
